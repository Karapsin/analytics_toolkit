[tox]
requires = tox>=4
env_list =
    lint
    type
    coverage
    artifacts
    py38-latest
    py39-latest
    py310-latest
    py311-latest
    py312-latest
    py313-latest
    py314-latest
    py38-min

[testenv]
description = run the test suite in {env_name}
skip_install = true
base_python =
    py38: {env:PYTHON38:python3.8}
    py39: {env:PYTHON39:python3.9}
    py310: {env:PYTHON310:python3.10}
    py311: {env:PYTHON311:python3.11}
    py312: {env:PYTHON312:python3.12}
    py313: {env:PYTHON313:python3.13}
    py314: {env:PYTHON314:python3.14}
set_env =
    PYTHONPYCACHEPREFIX = /tmp/utils_dev_pycache
pass_env =
    CPPFLAGS
    LDFLAGS
    PKG_CONFIG_PATH
deps =
    latest: pytest
    min: -c constraints/py38-min.txt
    min: pytest==8.3.5
commands_pre =
    latest: python -m pip install -e .
    min: python -m pip install -c constraints/py38-min.txt -e .
commands =
    python -m compileall analytics_toolkit tests
    min: python -m release_routines.lib.check_minimum_constraints
    min: python -m pip check
    pytest -q

[testenv:lint]
description = prevent new strict Ruff lint and formatting debt
base_python = {env:PYTHON311:python3.11}
deps = ruff>=0.15.20,<0.16
commands = python -m release_routines.lib.quality_debt lint

[testenv:type]
description = prevent new strict mypy debt against the Python 3.8 public floor
base_python = {env:PYTHON311:python3.11}
deps = mypy>=1.16.1,<1.17
commands_pre = python -m pip install -e .
commands = python -m release_routines.lib.quality_debt type

[testenv:coverage]
description = enforce branch coverage across all production modules
base_python = {env:PYTHON311:python3.11}
deps =
    coverage>=7.15,<8
    pytest
commands_pre = python -m pip install -e .
commands =
    coverage erase
    coverage run -m pytest -q
    coverage report

[testenv:artifacts]
description = build and smoke-test wheel and sdist artifacts outside the checkout
base_python = {env:PYTHON311:python3.11}
deps =
    build>=1.5,<2
    twine>=6.2,<7
    check-wheel-contents>=0.6.3,<0.7
commands = python -m release_routines.lib.artifact_smoke
