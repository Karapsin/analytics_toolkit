[tox]
requires = tox>=4,<4.26
env_list =
    py38-latest
    py39-latest
    py310-latest
    py311-latest
    py312-latest
    py313-latest
    py314-latest
    py38-min

[testenv]
description = run the test suite in {env_name}
skip_install = true
base_python =
    py38: {env:PYTHON38:python3.8}
    py39: {env:PYTHON39:python3.9}
    py310: {env:PYTHON310:python3.10}
    py311: {env:PYTHON311:python3.11}
    py312: {env:PYTHON312:python3.12}
    py313: {env:PYTHON313:python3.13}
    py314: {env:PYTHON314:python3.14}
set_env =
    PYTHONPYCACHEPREFIX = /tmp/utils_dev_pycache
pass_env =
    CPPFLAGS
    LDFLAGS
    PKG_CONFIG_PATH
deps =
    latest: pytest
    min: -c constraints/py38-min.txt
    min: pytest
commands_pre =
    latest: python -m pip install -e .
    min: python -m pip install -c constraints/py38-min.txt -e .
commands =
    python -m compileall analytics_toolkit tests
    pytest -q
