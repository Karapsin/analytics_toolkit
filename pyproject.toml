[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics_toolkit"
version = "1.2.1.0"
description = "Shared Python utilities for SQL, Excel, and date helpers."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "clickhouse-connect>=0.5.14,<1",
  "lz4>=4.3.2,<5",
  "numpy>=1.24.2,<2",
  "openpyxl>=3.1.1,<4",
  "orjson>=3.8.7,<4",
  "pandas>=1.4.4,<3",
  "psycopg2-binary>=2.9.5,<3",
  "python-dateutil>=2.8.2,<3",
  "pytz>=2022.7",
  "requests>=2.28.2,<3",
  "scipy>=1.10.1,<2",
  "sqlglot>=20,<31",
  "sqlparse>=0.4.3,<1",
  "tqdm>=4.65.0,<5",
  "trino>=0.320,<1",
  "zstandard>=0.20.0,<1",
]

[project.optional-dependencies]
airflow = ["apache-airflow>=2.4,<3"]

[project.scripts]
analytics-toolkit = "analytics_toolkit.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["analytics_toolkit*"]
