[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-toolkit"
version = "1.3.11.15"
description = "Shared Python utilities for SQL, Excel, and date helpers."
readme = "README.md"
requires-python = ">=3.8,<3.15"
license = { file = "LICENSE" }
authors = [
  { name = "analytics_toolkit contributors" },
]
keywords = [
  "analytics",
  "ab-testing",
  "sql",
  "excel",
  "airflow",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Office/Business",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "clickhouse-connect>=0.5.14,<1",
  "fsspec>=2024.2",
  "lz4>=4.3.2,<5",
  "numpy>=1.24.2,<2",
  "openpyxl>=3.1.1,<4",
  "orjson>=3.8.7,<4",
  "pandas>=1.4.4,<3",
  "psycopg2-binary>=2.9.5,<3",
  "pyarrow>=14,<23",
  "python-dateutil>=2.8.2,<3",
  "pytz>=2022.7",
  "requests>=2.28.2,<3",
  "s3fs>=2024.2",
  "scipy>=1.10.1,<2",
  "sqlglot>=26.33,<31",
  "sqlparse>=0.4.3,<1",
  "tqdm>=4.65.0,<5",
  "trino>=0.320,<1",
  "zstandard>=0.20.0,<1",
]

[project.optional-dependencies]
airflow = ["apache-airflow>=2.4,<3"]
clickhouse-native = [
  "clickhouse-driver>=0.2.9,<0.2.10; python_version == '3.8'",
  "clickhouse-driver>=0.2.10,<1; python_version >= '3.9'",
]

[project.scripts]
analytics-toolkit = "analytics_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/Karapsin/analytics_toolkit"
Source = "https://github.com/Karapsin/analytics_toolkit"
Issues = "https://github.com/Karapsin/analytics_toolkit/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["analytics_toolkit*"]

[tool.ruff]
target-version = "py38"
line-length = 100
src = ["analytics_toolkit", "tests", "agent_tools", "release_routines"]
extend-exclude = [
  ".mypy_cache",
  ".pytest_cache",
  ".rag_index",
  ".ruff_cache",
  ".tox",
  ".venv",
  "build",
  "dist",
]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN",    # Strict mypy owns production annotation coverage.
  "COM812", # Conflicts with the formatter.
  "D",      # Public documentation is enforced by the docs coverage checker.
  "ISC001", # Conflicts with the formatter.
]

[tool.ruff.lint.per-file-ignores]
"analytics_toolkit/cli.py" = ["T201"]
"agent_tools/**/*.py" = ["S603", "S607", "T201"]
"release_routines/**/*.py" = ["S603", "S607", "T201"]
"tests/**/*.py" = ["ARG", "FBT", "PLR2004", "S", "SLF001"]

[tool.mypy]
python_version = "3.8"
strict = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "clickhouse_connect.*",
  "clickhouse_driver.*",
  "dateutil.*",
  "fsspec.*",
  "lz4.*",
  "openpyxl.*",
  "orjson.*",
  "pandas.*",
  "psycopg2.*",
  "pyarrow.*",
  "pytz.*",
  "requests.*",
  "s3fs.*",
  "scipy.*",
  "sqlglot.*",
  "sqlparse.*",
  "tqdm.*",
  "trino.*",
  "zstandard.*",
]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["analytics_toolkit"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
testpaths = ["tests"]
python_files = ["*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
norecursedirs = [".*", "build", "dist", "_support"]
markers = [
  "integration: disposable real-database tests run only through the repository integration workflow",
  "integration_core: deterministic SQL database behavior",
  "integration_auth: TLS, certificate, OAuth, and Airflow SQL behavior",
  "integration_fault: destructive SQL retry and recovery behavior",
  "integration_stress: nightly SQL concurrency, pressure, and bounded-memory behavior",
  "sql_scenario(id): stable scenario identifier declared by the SQL coverage manifest",
]

[tool.coverage.report]
fail_under = 90
precision = 2
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
