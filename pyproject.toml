[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-toolkit"
version = "1.3.10.12"
description = "Shared Python utilities for SQL, Excel, and date helpers."
readme = "README.md"
requires-python = ">=3.8,<3.15"
license = { file = "LICENSE" }
authors = [
  { name = "analytics_toolkit contributors" },
]
keywords = [
  "analytics",
  "ab-testing",
  "sql",
  "excel",
  "airflow",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Office/Business",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "clickhouse-connect>=0.5.14,<1",
  "fsspec>=2024.2",
  "lz4>=4.3.2,<5",
  "numpy>=1.24.2,<2",
  "openpyxl>=3.1.1,<4",
  "orjson>=3.8.7,<4",
  "pandas>=1.4.4,<3",
  "psycopg2-binary>=2.9.5,<3",
  "pyarrow>=14,<23",
  "python-dateutil>=2.8.2,<3",
  "pytz>=2022.7",
  "requests>=2.28.2,<3",
  "s3fs>=2024.2",
  "scipy>=1.10.1,<2",
  "sqlglot>=20,<31",
  "sqlparse>=0.4.3,<1",
  "tqdm>=4.65.0,<5",
  "trino>=0.320,<1",
  "zstandard>=0.20.0,<1",
]

[project.optional-dependencies]
airflow = ["apache-airflow>=2.4,<3"]

[project.scripts]
analytics-toolkit = "analytics_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/Karapsin/analytics_toolkit"
Source = "https://github.com/Karapsin/analytics_toolkit"
Issues = "https://github.com/Karapsin/analytics_toolkit/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["analytics_toolkit*"]
