name: compatibility

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: python-support-policy
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Require repository metadata to match the Python support policy
        run: python -m release_routines.lib.python_support check
      - name: Build the compatibility matrix from the Python support policy
        id: matrix
        run: echo "matrix=$(python -m release_routines.lib.python_support matrix)" >> "$GITHUB_OUTPUT"

  tests:
    name: ${{ matrix.env_name }}
    needs: policy
    runs-on: ubuntu-latest
    env:
      RASTER_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      RASTER_BASE: 4a17e91b20b2683aca365f486e6217a141ef8c5b
      RASTER_PROFILE: ${{ matrix.env_name }}
      # Lagging extras are not installed; tests/_support/extras.py skips their test modules.
      ATK_WITHOUT_EXTRAS: ${{ matrix.without_extras }}
    strategy:
      fail-fast: false
      # Driven by release_routines/python_support.json; see docs/PYTHON_SUPPORT.md.
      matrix: ${{ fromJSON(needs.policy.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install raster regression fonts
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fontconfig fonts-dejavu-core
          fc-match --format='%{family}\t%{file}\n' 'DejaVu Sans Mono'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Probe Python 3.9 renderer in a disposable environment
        if: startsWith(matrix.env_name, 'py39-')
        # Observation only: resvg-py>=0.5 has no Python 3.9 builds and is never adopted here.
        continue-on-error: true
        run: >-
          python -m tests.agent_tools._support.renderer_probe
          --profile "${{ matrix.env_name }}"
          --output "raster-diagnostics/${{ matrix.env_name }}/probe"

      - name: Install latest test environment
        id: latest
        if: ${{ !cancelled() && matrix.profile == 'latest' }}
        run: python -m pip install -e "${{ matrix.install_target }}" pytest "Pillow>=10,<13" "resvg-py>=0.5,<0.6; python_version >= '3.10'"

      - name: Install minimum dependency test environment
        id: minimum
        if: ${{ !cancelled() && matrix.profile == 'min' }}
        run: python -m pip install -c "${{ matrix.constraints }}" -e "${{ matrix.install_target }}" pytest==8.3.5 "Pillow>=10,<13" "resvg-py>=0.5,<0.6; python_version >= '3.10'"

      - name: Validate minimum dependency constraints
        if: matrix.profile == 'min'
        run: |
          python -m release_routines.lib.check_minimum_constraints
          python -m pip check

      - name: Compile package and tests
        run: PYTHONPYCACHEPREFIX=/tmp/utils_dev_pycache python -m compileall analytics_toolkit tests

      - name: Collect every causal raster case before strict assertions
        if: ${{ !cancelled() && !startsWith(matrix.env_name, 'py39-') && !contains(matrix.without_extras, 'tui') && (steps.latest.outcome == 'success' || steps.minimum.outcome == 'success') }}
        run: >-
          python -m tests.agent_tools._support.renderer_probe
          --collect-current --output "raster-diagnostics/${{ matrix.env_name }}"

      - name: Require fast causal-diagnostic regressions
        if: ${{ !cancelled() && !startsWith(matrix.env_name, 'py39-') && !contains(matrix.without_extras, 'tui') && (steps.latest.outcome == 'success' || steps.minimum.outcome == 'success') }}
        run: python -m pytest -q tests/agent_tools/raster_observations.py

      - name: Require actual renderer regression
        if: ${{ !cancelled() && !startsWith(matrix.env_name, 'py39-') && !contains(matrix.without_extras, 'tui') && (steps.latest.outcome == 'success' || steps.minimum.outcome == 'success') }}
        run: python -m pytest -q tests/agent_tools/underline_rasterization.py

      - name: Run tests
        run: PYTHONPYCACHEPREFIX=/tmp/utils_dev_pycache pytest -q

      - name: Freeze environment
        if: always()
        run: python -m pip freeze

      - name: Retain complete or explicitly incomplete raster diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raster-${{ matrix.env_name }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: raster-diagnostics/${{ matrix.env_name }}/
          if-no-files-found: warn

  sdk-conformance:
    name: ${{ matrix.env_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env_name: [py310-sdk31, py310-sdk32]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install "tox>=4,<5"
      - run: tox -e ${{ matrix.env_name }}

  python-support-drift:
    name: python-support-drift
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # Exit status 3 / "RELEASE DATA UNAVAILABLE" means the window was not judged; rerun.
      - name: Fetch stable CPython releases
        id: released
        run: python -m release_routines.lib.python_support_drift released --output "$RUNNER_TEMP/python-releases.json"
      - name: Set up the newest stable CPython
        id: newest
        uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.released.outputs.newest }}
      - name: Report an unavailable newest CPython interpreter
        if: failure() && steps.newest.outcome == 'failure'
        env:
          NEWEST: ${{ steps.released.outputs.newest }}
        run: |
          echo "::error title=Python release data unavailable::CPython $NEWEST is not yet available from actions/setup-python; rerun later."
          echo "RELEASE DATA UNAVAILABLE: the support window was not evaluated." >&2
          exit 3
      - name: Resolve core and every extra on the newest stable CPython
        run: python -m release_routines.lib.python_support_drift probe --output "$RUNNER_TEMP/python-support-probe.json"
      # Exit status 1 / "STALE PYTHON SUPPORT WINDOW" needs a reviewed policy update PR.
      - name: Compare the Python support window with releases and extra support
        run: >-
          python -m release_routines.lib.python_support_drift evaluate
          --released "$RUNNER_TEMP/python-releases.json"
          --probe "$RUNNER_TEMP/python-support-probe.json"

  compatibility-checks:
    name: compatibility-checks
    needs: [policy, tests, sdk-conformance, python-support-drift]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every compatibility profile
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PYTHON'
          import json, os
          assert all(job['result'] == 'success' for job in json.loads(os.environ['RESULTS']).values())
          PYTHON
