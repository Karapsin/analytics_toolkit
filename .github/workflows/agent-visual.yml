name: agent-visual
run-name: Visual ${{ inputs.candidate }}
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Immutable temporary candidate SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate }}
          persist-credentials: false
          fetch-depth: 0
      - name: Load trusted artifact exporter
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .agent-visual-controller
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[tui]' -r agent_tools/requirements-mcp.txt
      - name: Capture every scene headlessly
        id: capture
        env:
          CANDIDATE: ${{ inputs.candidate }}
          PYTHONPATH: ${{ github.workspace }}
        run: python .agent-visual-controller/.github/agent/capture_artifact.py
      - uses: actions/upload-artifact@v4
        with:
          name: agent-visual-${{ inputs.candidate }}
          path: visual-artifact/
          retention-days: 7
      - name: Upload failed capture diagnostics
        if: always() && steps.capture.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: agent-visual-diagnostics-${{ inputs.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: visual-diagnostics/
          if-no-files-found: error
          retention-days: 7
