name: agent-visual
run-name: Visual ${{ inputs.candidate }}
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Immutable temporary candidate SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Load trusted artifact exporter
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .agent-visual-controller
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Capture every scene headlessly
        id: capture
        working-directory: ${{ runner.temp }}
        env:
          CANDIDATE: ${{ inputs.candidate }}
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
        run: python -I "$GITHUB_WORKSPACE/.agent-visual-controller/.github/agent/capture_isolation.py"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-visual-${{ inputs.candidate }}
          path: ${{ steps.capture.outputs.artifact_root }}/visual-artifact/
          if-no-files-found: error
          retention-days: 7
      - name: Upload failed capture diagnostics
        if: always() && steps.capture.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: agent-visual-diagnostics-${{ inputs.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.capture.outputs.artifact_root }}/visual-diagnostics/
          if-no-files-found: error
          retention-days: 7
      - name: Upload container and collection diagnostics
        if: always() && steps.capture.outputs.artifact_root != ''
        uses: actions/upload-artifact@v4
        with:
          name: agent-visual-isolation-${{ inputs.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.capture.outputs.artifact_root }}/isolation-diagnostics/
          if-no-files-found: error
          retention-days: 7
