name: sql-integration

on:
  push:
    branches: [dev]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: Integration profile
        required: true
        default: all
        type: choice
        options: [all, core, auth, fault]

permissions:
  contents: read

concurrency:
  group: sql-integration-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  core:
    name: core SQL integration
    if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'core'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and agent tools
        run: python -m pip install --upgrade -r agent_tools/requirements-mcp.txt -e . pytest
      - name: Run core SQL integration profile
        run: agent_tools/mcp_tool.sh run-checks --area sql --level integration --integration-profile core
      - name: Upload core diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sql-integration-core
          path: .integration-artifacts/core
          if-no-files-found: error

  auth:
    name: authentication SQL integration
    if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'auth'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package, agent tools, and pinned Airflow
        run: |
          python -m pip install --upgrade -r agent_tools/requirements-mcp.txt -e . pytest
          python -m pip install "apache-airflow==2.10.5" --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt"
      - name: Run authentication SQL integration profile
        run: agent_tools/mcp_tool.sh run-checks --area sql --level integration --integration-profile auth
      - name: Upload authentication diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sql-integration-auth
          path: .integration-artifacts/auth
          if-no-files-found: error

  fault:
    name: destructive fault injection
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'fault'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and agent tools
        run: python -m pip install --upgrade -r agent_tools/requirements-mcp.txt -e . pytest
      - name: Run destructive fault profile
        run: agent_tools/mcp_tool.sh run-checks --area sql --level integration --integration-profile fault
      - name: Upload fault diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sql-integration-fault
          path: .integration-artifacts/fault
          if-no-files-found: error
