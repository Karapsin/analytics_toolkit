name: sql-integration

on:
  push:
    branches: [dev]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: Integration profile
        required: true
        default: all
        type: choice
        options: [all, core, auth, fault, stress]

permissions:
  contents: read

concurrency:
  group: sql-integration-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  core:
    name: core SQL integration (HTTP + native)
    if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'core'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and agent tools
        run: python -m pip install --upgrade -r agent_tools/requirements-mcp.txt -e '.[clickhouse-native]' pytest
      - name: Run core SQL integration profile
        run: agent_tools/mcp_tool.sh run-checks --area sql --level integration --integration-profile core
      - name: Upload HTTP core diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sql-integration-core-http
          path: .integration-artifacts/core/http
          if-no-files-found: error
      - name: Upload native core diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sql-integration-core-native
          path: .integration-artifacts/core/native
          if-no-files-found: error

  auth:
    name: authentication SQL integration (HTTP + native)
    if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'auth'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package, agent tools, and pinned Airflow
        run: |
          python -m pip install --upgrade -r agent_tools/requirements-mcp.txt -e '.[clickhouse-native]' pytest
          python -m pip install -r integration/requirements-auth.txt
          python -m pip install --upgrade 'httpx>=0.27.1,<1' 'requests>=2.32.4' 'typing-extensions>=4.15'
          python -m pip check
          playwright install --with-deps chromium
      - name: Run authentication SQL integration profile
        run: agent_tools/mcp_tool.sh run-checks --area sql --level integration --integration-profile auth
      - name: Upload HTTP authentication diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sql-integration-auth-http
          path: .integration-artifacts/auth/http
          if-no-files-found: error
      - name: Upload native authentication diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sql-integration-auth-native
          path: .integration-artifacts/auth/native
          if-no-files-found: error

  fault:
    name: destructive fault injection (HTTP + native)
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'fault'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [database, staging, authentication]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package, agent tools, and auth fault dependencies
        run: |
          python -m pip install --upgrade -r agent_tools/requirements-mcp.txt -e '.[clickhouse-native]' pytest
          python -m pip install -r integration/requirements-auth.txt
          python -m pip install --upgrade 'httpx>=0.27.1,<1' 'requests>=2.32.4' 'typing-extensions>=4.15'
          python -m pip check
          playwright install --with-deps chromium
      - name: Run destructive fault profile
        run: >-
          python -m release_routines.sql_integration
          --profile fault
          --with-greenplum
          --fault-group ${{ matrix.group }}
      - name: Upload HTTP fault diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sql-integration-fault-${{ matrix.group }}-http
          path: .integration-artifacts/fault/http
          if-no-files-found: error
      - name: Upload native fault diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sql-integration-fault-${{ matrix.group }}-native
          path: .integration-artifacts/fault/native
          if-no-files-found: error

  stress:
    name: SQL integration stress (HTTP + native)
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'stress'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and agent tools
        run: python -m pip install --upgrade -r agent_tools/requirements-mcp.txt -e '.[clickhouse-native]' pytest psutil
      - name: Run SQL integration stress profile
        run: >-
          python -m release_routines.sql_integration
          --profile stress
          --with-greenplum
      - name: Upload HTTP stress diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sql-integration-stress-http
          path: .integration-artifacts/stress/http
          if-no-files-found: error
      - name: Upload native stress diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sql-integration-stress-native
          path: .integration-artifacts/stress/native
          if-no-files-found: error
