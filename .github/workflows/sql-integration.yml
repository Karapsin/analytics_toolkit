name: sql-integration

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sql-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: disposable SQL backends
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and agent tools
        run: >-
          python -m pip install --upgrade
          -r agent_tools/requirements-mcp.txt
          -e .
          pytest

      - name: Run disposable SQL integration tests
        run: agent_tools/mcp_tool.sh run-checks --area sql --level integration

      - name: Upload Compose diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: sql-integration-compose-logs
          path: .integration-artifacts/compose.log
          if-no-files-found: ignore
