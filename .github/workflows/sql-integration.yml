name: sql-integration
run-name: ${{ inputs.candidate && format('agent integration {0} PR {1}', inputs.candidate, inputs.pull_number) || 'Manual integration' }}

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Immutable PR candidate SHA (empty tests dev)
        type: string
        default: ""
      pull_number:
        description: Source PR number
        type: string
        default: "0"
      profile:
        description: Integration profile
        required: true
        default: all
        type: choice
        options: [all, core, auth, fault, stress]

permissions:
  contents: read

concurrency:
  group: sql-integration-${{ inputs.candidate || github.sha }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  policy:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.policy.outputs.core }}
      auth: ${{ steps.policy.outputs.auth }}
      fault-python: ${{ steps.policy.outputs.fault-python }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - id: policy
        run: |
          python -m release_routines.lib.python_support_integration > integration-plan.json
          python - <<'PY'
          import json, os
          plan = json.load(open("integration-plan.json"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("core=" + plan["core"], file=output)
              print("auth=" + json.dumps(plan["auth"]), file=output)
              print("fault-python=" + plan["fault"]["python"], file=output)
          PY

  core-http:
    needs: policy
    name: core SQL integration (HTTP)
    if: inputs.profile == 'all' || inputs.profile == 'core'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.policy.outputs.core }}
          cache: pip
      - name: Install package and agent tools
        run: python -m pip install --upgrade -r agent_tools/requirements-mcp.txt -e '.[clickhouse-native]' pytest
      - name: Run core SQL integration profile
        run: >-
          agent_tools/mcp_tool.sh run-checks
          --area sql
          --level integration
          --integration-profile core
          --integration-clickhouse-driver http
      - name: Report captured startup diagnostics
        if: failure()
        run: |
          for log in .integration-artifacts/*/*/build.log .integration-artifacts/*/*/startup.log; do
            if [ -f "$log" ]; then
              printf '\n%s\n' "$log"
              tail -n 80 "$log"
            fi
          done
      - name: Upload HTTP core diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sql-integration-core-http
          path: .integration-artifacts/core/http
          if-no-files-found: error
  core-native:
    needs: policy
    name: core SQL integration (native)
    if: inputs.profile == 'all' || inputs.profile == 'core'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.policy.outputs.core }}
          cache: pip
      - name: Install package and agent tools
        run: python -m pip install --upgrade -r agent_tools/requirements-mcp.txt -e '.[clickhouse-native]' pytest
      - name: Run core SQL integration profile
        run: >-
          agent_tools/mcp_tool.sh run-checks
          --area sql
          --level integration
          --integration-profile core
          --integration-clickhouse-driver native
      - name: Report captured startup diagnostics
        if: failure()
        run: |
          for log in .integration-artifacts/*/*/build.log .integration-artifacts/*/*/startup.log; do
            if [ -f "$log" ]; then
              printf '\n%s\n' "$log"
              tail -n 80 "$log"
            fi
          done
      - name: Upload native core diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sql-integration-core-native
          path: .integration-artifacts/core/native
          if-no-files-found: error

  auth:
    needs: policy
    name: authentication SQL integration (HTTP + native, Airflow ${{ matrix.airflow }})
    if: inputs.profile == 'all' || inputs.profile == 'auth'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.policy.outputs.auth) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package and pinned Airflow
        run: |
          python -m pip install --upgrade -e '.[clickhouse-native]' pytest
          python -m release_routines.lib.python_support_integration --requirements '${{ matrix.airflow }}' > integration-auth-ci.txt
          python -m pip install -r integration-auth-ci.txt
          python -m pip install --upgrade 'httpx>=0.27.1,<1' 'requests>=2.32.4' 'typing-extensions>=4.15'
          python -m pip check
          playwright install --with-deps chromium
      - name: Run authentication SQL integration profile
        run: agent_tools/mcp_tool.sh run-checks --area sql --level integration --integration-profile auth
      - name: Report captured startup diagnostics
        if: failure()
        run: |
          for log in .integration-artifacts/*/*/build.log .integration-artifacts/*/*/startup.log; do
            if [ -f "$log" ]; then
              printf '\n%s\n' "$log"
              tail -n 80 "$log"
            fi
          done
      - name: Upload HTTP authentication diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sql-integration-auth-http-airflow${{ matrix.airflow }}
          path: .integration-artifacts/auth/http
          if-no-files-found: error
      - name: Upload native authentication diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sql-integration-auth-native-airflow${{ matrix.airflow }}
          path: .integration-artifacts/auth/native
          if-no-files-found: error

  fault:
    needs: policy
    name: destructive fault injection (HTTP + native)
    if: inputs.profile == 'all' || inputs.profile == 'fault'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [database, staging, authentication]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.policy.outputs.fault-python }}
          cache: pip
      - name: Install package and auth fault dependencies
        run: |
          python -m pip install --upgrade -e '.[clickhouse-native]' pytest
          python -m release_routines.lib.python_support_integration --requirements fault > integration-auth-ci.txt
          python -m pip install -r integration-auth-ci.txt
          python -m pip install --upgrade 'httpx>=0.27.1,<1' 'requests>=2.32.4' 'typing-extensions>=4.15'
          python -m pip check
          playwright install --with-deps chromium
      - name: Run destructive fault profile
        run: >-
          python -m release_routines.sql_integration
          --profile fault
          --with-greenplum
          --fault-group ${{ matrix.group }}
      - name: Report captured startup diagnostics
        if: failure()
        run: |
          for log in .integration-artifacts/*/*/build.log .integration-artifacts/*/*/startup.log; do
            if [ -f "$log" ]; then
              printf '\n%s\n' "$log"
              tail -n 80 "$log"
            fi
          done
      - name: Upload HTTP fault diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sql-integration-fault-${{ matrix.group }}-http
          path: .integration-artifacts/fault/http
          if-no-files-found: error
      - name: Upload native fault diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sql-integration-fault-${{ matrix.group }}-native
          path: .integration-artifacts/fault/native
          if-no-files-found: error

  stress:
    needs: policy
    name: SQL integration stress (HTTP + native)
    if: inputs.profile == 'all' || inputs.profile == 'stress'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.policy.outputs.core }}
          cache: pip
      - name: Install package and agent tools
        run: python -m pip install --upgrade -r agent_tools/requirements-mcp.txt -e '.[clickhouse-native]' pytest psutil
      - name: Run SQL integration stress profile
        run: >-
          python -m release_routines.sql_integration
          --profile stress
          --with-greenplum
      - name: Report captured startup diagnostics
        if: failure()
        run: |
          for log in .integration-artifacts/*/*/build.log .integration-artifacts/*/*/startup.log; do
            if [ -f "$log" ]; then
              printf '\n%s\n' "$log"
              tail -n 80 "$log"
            fi
          done
      - name: Upload HTTP stress diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sql-integration-stress-http
          path: .integration-artifacts/stress/http
          if-no-files-found: error
      - name: Upload native stress diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sql-integration-stress-native
          path: .integration-artifacts/stress/native
          if-no-files-found: error
