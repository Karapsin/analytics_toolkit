name: tests

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
    inputs:
      visual_isolation_probe:
        description: Run the separately reviewed native container infrastructure probe
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  visual-isolation-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.visual_isolation_probe
    name: Visual isolation infrastructure Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Probe reviewed container infrastructure without host candidate execution
        id: probe
        working-directory: ${{ runner.temp }}
        env:
          PROBE_PYTHON: ${{ matrix.python }}
        run: python -I "$GITHUB_WORKSPACE/.github/agent/capture_isolation_probe.py"
      - name: Retain complete or explicitly incomplete native probe evidence
        if: always() && steps.probe.outputs.artifact_root != ''
        uses: actions/upload-artifact@v4
        with:
          name: visual-isolation-infrastructure-${{ matrix.python }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.probe.outputs.artifact_root }}/isolation-diagnostics/
            ${{ steps.probe.outputs.artifact_root }}/probe-evidence/
          if-no-files-found: error
          retention-days: 7

  fast-checks:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.visual_isolation_probe && 'Probe-only fast checks' || 'fast-checks' }}
    needs: [tests, sdk-conformance, quality]
    if: always() && !(github.event_name == 'workflow_dispatch' && inputs.visual_isolation_probe)
    runs-on: ubuntu-latest
    steps:
      - name: Require every fast validation job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          assert all(job["result"] == "success" for job in json.loads(os.environ["RESULTS"]).values())
          PY

  tests:
    if: "!(github.event_name == 'workflow_dispatch' && inputs.visual_isolation_probe)"
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.visual_isolation_probe && 'Probe-only tests' || matrix.env_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.8"
            env_name: py38-latest
          - python-version: "3.9"
            env_name: py39-latest
          - python-version: "3.10"
            env_name: py310-latest
          - python-version: "3.11"
            env_name: py311-latest
          - python-version: "3.12"
            env_name: py312-latest
          - python-version: "3.13"
            env_name: py313-latest
          - python-version: "3.14"
            env_name: py314-latest
          - python-version: "3.8"
            env_name: py38-min

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install latest test environment
        if: matrix.env_name != 'py38-min'
        run: python -m pip install -e '.[tui,datalens]' pytest

      - name: Install minimum Python 3.8 test environment
        if: matrix.env_name == 'py38-min'
        run: python -m pip install -c constraints/py38-min.txt -e '.[tui,datalens]' pytest==8.3.5

      - name: Validate minimum dependency constraints
        if: matrix.env_name == 'py38-min'
        run: |
          python -m release_routines.lib.check_minimum_constraints
          python -m pip check

      - name: Compile package and tests
        run: PYTHONPYCACHEPREFIX=/tmp/utils_dev_pycache python -m compileall analytics_toolkit tests

      - name: Run tests
        run: PYTHONPYCACHEPREFIX=/tmp/utils_dev_pycache pytest -q

      - name: Freeze environment
        if: always()
        run: python -m pip freeze

  sdk-conformance:
    if: "!(github.event_name == 'workflow_dispatch' && inputs.visual_isolation_probe)"
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.visual_isolation_probe && 'Probe-only SDK conformance' || matrix.env_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env_name: [py310-sdk31, py310-sdk32]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install "tox>=4,<5"
      - run: tox -e ${{ matrix.env_name }}

  quality:
    if: "!(github.event_name == 'workflow_dispatch' && inputs.visual_isolation_probe)"
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.visual_isolation_probe && 'Probe-only quality checks' || 'quality gates' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install tox
        run: python -m pip install --upgrade "tox>=4,<5"

      - name: Run lint, type, coverage, and artifact gates
        run: tox -e lint,type,coverage,artifacts
