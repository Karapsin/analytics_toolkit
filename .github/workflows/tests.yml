name: tests

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.policy.outputs.tests }}
      extras: ${{ steps.policy.outputs.extras }}
      coverage: ${{ steps.policy.outputs.coverage }}
      sdk: ${{ steps.policy.outputs.sdk }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - id: policy
        run: |
          python -m release_routines.lib.python_support check
          echo "tests=$(python -m release_routines.lib.python_support matrix)" >> "$GITHUB_OUTPUT"
          echo "extras=$(python -m release_routines.lib.python_support extras)" >> "$GITHUB_OUTPUT"
          echo "coverage=$(python -m release_routines.lib.python_support coverage)" >> "$GITHUB_OUTPUT"
          echo "sdk=$(python -m release_routines.lib.python_support sdk)" >> "$GITHUB_OUTPUT"

  fast-checks:
    name: fast-checks
    needs: [matrix, tests, extras, airflow-compatibility, sdk-conformance, quality]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every fast validation job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          assert all(job["result"] == "success" for job in json.loads(os.environ["RESULTS"]).values())
          PY

  tests:
    name: ${{ matrix.env_name }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.tests) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install supported test extras
        run: |
          if [[ '${{ matrix.env_name }}' == *-min ]]; then
            python -m pip install -c constraints/python-min.txt pytest==8.3.5
            python -m release_routines.lib.python_support_install min
            python -m release_routines.lib.check_minimum_constraints
          else
            python -m pip install pytest
            python -m release_routines.lib.python_support_install latest
          fi
          python -m pip check
      - run: PYTHONPYCACHEPREFIX=/tmp/utils_dev_pycache python -m compileall analytics_toolkit atk tests
      - run: PYTHONPYCACHEPREFIX=/tmp/utils_dev_pycache python -m release_routines.lib.python_support_test
      - run: python -m pip freeze
        if: always()

  extras:
    name: Python ${{ matrix.python-version }} extra ${{ matrix.extra }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.extras) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[${{ matrix.extra }}]' pytest
      - run: python -m pip check
      - run: python -m release_routines.lib.python_support_probe '${{ matrix.extra }}'

  airflow-compatibility:
    name: Airflow ${{ matrix.airflow }} on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {airflow: '2.4.3', python: '3.9'}
          - {airflow: '2.11.0', python: '3.12'}
          - {airflow: '3.0.0', python: '3.10'}
          - {airflow: '3.3.2', python: '3.14'}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[airflow]' 'apache-airflow==${{ matrix.airflow }}' pytest
      - run: python -m pip check
      - run: python -m release_routines.lib.python_support_probe airflow

  sdk-conformance:
    name: DataLens SDK ${{ matrix.sdk }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ['31', '32']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.matrix.outputs.sdk }}
          cache: pip
      - run: python -m pip install 'tox>=4,<5'
      - run: tox -e "py${SDK_PYTHON//./}-sdk${SDK_VERSION}"
        env:
          SDK_PYTHON: ${{ needs.matrix.outputs.sdk }}
          SDK_VERSION: ${{ matrix.sdk }}

  quality:
    name: quality gates
    needs: matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.matrix.outputs.coverage }}
          cache: pip
      - run: python -m pip install --upgrade 'tox>=4,<5'
      - run: tox -e lint,type,coverage,artifacts
