global
  log stdout format raw local0

defaults
  log global
  mode tcp
  timeout connect 10s
  timeout client 60s
  timeout server 60s

frontend gp_tls
  bind *:19432 ssl crt /certs/server.pem ca-file /certs/ca.crt verify required
  default_backend gp_plain
backend gp_plain
  server gp greenplum:5432 check init-addr last,libc,none

frontend trino_tls
  bind *:18443 ssl crt /certs/server.pem
  mode http
  http-request set-header X-Forwarded-Proto https
  http-request set-header X-Forwarded-Port 18443
  default_backend trino_auth_plain
backend trino_auth_plain
  mode http
  server trino_auth trino-auth:8080 check

frontend trino_oauth_tls
  bind *:18446 ssl crt /certs/server.pem
  mode http
  http-request set-header X-Forwarded-Proto https
  http-request set-header X-Forwarded-Port 18446
  default_backend trino_oauth_plain
backend trino_oauth_plain
  mode http
  server trino_oauth trino-oauth:8080 check init-addr last,libc,none

frontend trino_invalid_oauth_tls
  bind *:18449 ssl crt /certs/server.pem
  mode http
  http-request set-header X-Forwarded-Proto https
  http-request set-header X-Forwarded-Port 18449
  default_backend trino_invalid_oauth_plain
backend trino_invalid_oauth_plain
  mode http
  server trino_oauth_invalid trino-oauth-invalid:8080 check init-addr last,libc,none

frontend clickhouse_tls
  bind *:18444 ssl crt /certs/server.pem
  default_backend clickhouse_plain
backend clickhouse_plain
  server clickhouse clickhouse:8123 check

frontend trino_hostname_tls
  bind *:18447 ssl crt /certs/dns-server.pem
  mode http
  http-request set-header X-Forwarded-Proto https
  default_backend trino_auth_plain

frontend clickhouse_hostname_tls
  bind *:18448 ssl crt /certs/dns-server.pem
  default_backend clickhouse_plain

frontend keycloak_tls
  bind *:18445 ssl crt /certs/server.pem
  mode http
  http-request set-header X-Forwarded-Proto https
  http-request set-header X-Forwarded-Port 18445
  http-request set-header X-Forwarded-Host keycloak.localhost:18445
  default_backend keycloak_plain
backend keycloak_plain
  mode http
  server keycloak keycloak:8080 check
